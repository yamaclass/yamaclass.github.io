<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  test
  <div class="layout">
    <aside class="sidebar">
      <h3>初級IT国家資格取得支援講義</h3>

      {% assign menu_pages = site.pages | where_exp: "page", "page.url contains '/kait_ipass/'" | sort: "title" %}

      <ul>
        {% for menu_page in menu_pages %}
        {% if menu_page.title %}
        <li>
          <a href="{{ menu_page.url | relative_url }}">{{ menu_page.title }}</a>
        </li>
        {% endif %}
        {% endfor %}
      </ul>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
</body>

</html>
